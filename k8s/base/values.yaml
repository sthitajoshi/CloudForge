# Defaults. Every environment overrides some of this in
# k8s/overlays/<env>/values.yaml — that file is the only thing that differs
# between dev, staging and prod.

replicaCount: 1

image:
  repository: cloudforge-app
  tag: latest
  # kind loads images directly into the node, so there is nothing to pull.
  # Always would put pods in ImagePullBackOff.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

networkPolicy:
  enabled: true

probes:
  path: /healthz
