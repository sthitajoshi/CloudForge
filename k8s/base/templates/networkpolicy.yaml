{{- if .Values.networkPolicy.enabled }}
# Kubernetes has no implicit deny: a pod with no policy selecting it accepts
# traffic from anywhere. This first policy selects every pod in the namespace
# and permits nothing, which flips the default to deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudforge-app.fullname" . }}-default-deny
  labels:
    {{- include "cloudforge-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Then one narrow exception: the app port, reachable only from inside this
# namespace. Policies are additive, so this re-opens exactly one path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudforge-app.fullname" . }}-allow-http
  labels:
    {{- include "cloudforge-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudforge-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
