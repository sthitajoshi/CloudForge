apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudforge-app.fullname" . }}
  labels:
    {{- include "cloudforge-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudforge-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudforge-app.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        # Must be numeric. The image sets USER by name, and the kubelet
        # cannot verify a named user is non-root — it refuses to start the
        # pod rather than guess. 65532 is distroless's nonroot UID.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness restarts a wedged container; readiness only pulls it out
          # of the Service. Conflating them causes restart loops under load.
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
