# App-of-Apps root. This is the only object applied by hand; it watches
# argocd/apps/ and creates one Application per environment from it. Adding
# an environment then means committing a file, not running kubectl.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sthitajoshi/cloudforge.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
