apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sthitajoshi/CloudForge.git
    targetRevision: main
    path: k8s/base
    helm:
      valueFiles:
        - ../overlays/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
