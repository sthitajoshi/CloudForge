name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        working-directory: app
        run: go test ./...

      - name: Set image tag
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Container registries reject uppercase in repository names, and
          # github.repository preserves the owner/repo casing verbatim.
          echo "image=${REGISTRY}/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t local/app:${{ steps.vars.outputs.sha_short }} ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/app:${{ steps.vars.outputs.sha_short }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          SHA="${{ steps.vars.outputs.sha_short }}"
          docker tag local/app:$SHA $IMAGE:$SHA
          docker tag local/app:$SHA $IMAGE:latest
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest
