name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        working-directory: app
        run: go test ./...

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t local/app:${{ steps.vars.outputs.sha_short }} ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/app:${{ steps.vars.outputs.sha_short }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker tag local/app:${{ steps.vars.outputs.sha_short }} $IMAGE:${{ steps.vars.outputs.sha_short }}
          docker tag local/app:${{ steps.vars.outputs.sha_short }} $IMAGE:latest
          docker push $IMAGE:${{ steps.vars.outputs.sha_short }}
          docker push $IMAGE:latest
