name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    # LocalStack runs alongside the job, so this is a genuine end-to-end
    # apply rather than a dry run -- the same HCL, against the same AWS
    # APIs, just an ephemeral target. Pointing this at a real account means
    # deleting this service block and swapping the provider credentials for
    # an OIDC role; nothing in terraform/ changes.
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,iam,ec2,sts
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # The state backend cannot store its own state, so it is created
      # first with local state.
      - name: Bootstrap the state backend
        run: |
          terraform -chdir=terraform/bootstrap init
          terraform -chdir=terraform/bootstrap apply -auto-approve

      - name: Apply every environment
        run: |
          for env in dev staging prod; do
            echo "::group::apply $env"
            terraform -chdir=terraform/envs/$env init
            terraform -chdir=terraform/envs/$env apply \
              -auto-approve -var-file=$env.tfvars
            echo "::endgroup::"
          done
