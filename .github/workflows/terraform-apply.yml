name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # LocalStack runs as a normal container rather than a job `services:`
      # block. Service containers start before the workflow can configure
      # them and cannot be given the Docker socket, which LocalStack needs;
      # starting it here also makes its logs readable when something fails.
      #
      # Pinned to 4.9 deliberately. From the 2026 releases onward the image
      # refuses to start without a LOCALSTACK_AUTH_TOKEN -- it exits 55 with
      # "License activation failed" -- which would make CI depend on a
      # personal credential and stop anyone forking this repo from running
      # it. 4.9 is the newest tag that still starts unlicensed, and it
      # covers every service this project uses.
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=s3,dynamodb,iam,ec2,sts \
            -e DEBUG=1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            localstack/localstack:4.9

      - name: Wait for LocalStack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health | grep -q '"s3"'; then
              echo "LocalStack ready after ${i} attempts"
              curl -s http://localhost:4566/_localstack/health
              exit 0
            fi
            sleep 5
          done
          echo "::error::LocalStack did not become ready in time"
          docker logs localstack --tail 50
          exit 1

      # The state backend cannot store its own state, so it is created
      # first with local state.
      - name: Bootstrap the state backend
        run: |
          terraform -chdir=terraform/bootstrap init -input=false
          terraform -chdir=terraform/bootstrap apply -auto-approve -input=false

      - name: Apply every environment
        run: |
          for env in dev staging prod; do
            echo "::group::apply $env"
            terraform -chdir=terraform/envs/$env init -input=false
            terraform -chdir=terraform/envs/$env apply \
              -auto-approve -input=false -var-file=$env.tfvars
            echo "::endgroup::"
          done

      # This target is ephemeral -- it disappears with the runner. The point
      # is proving the pipeline applies cleanly from nothing, which is the
      # same guarantee the local rebuild test gives.
      - name: Show what was created
        run: |
          docker exec localstack awslocal s3 ls
          docker exec localstack awslocal iam list-roles \
            --query 'Roles[].RoleName' --output text

      - name: LocalStack logs on failure
        if: failure()
        run: docker logs localstack --tail 100
